server {
    # On écoute explicitement sur le port 3000
    listen 3000;
    server_name localhost;

    # Dossier où se trouvent les fichiers de l'application
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Très important pour les applications React/Vite :
        # Redirige toutes les requêtes vers index.html pour éviter les erreurs 404
        try_files $uri $uri/ /index.html;
    }

    # Configuration basique pour les pages d'erreur
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
